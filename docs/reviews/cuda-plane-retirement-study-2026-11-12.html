<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}
main{width:100%;margin:0}section{padding:16px;border-radius:var(--radius);background:var(--card)}
button{font:inherit;color:var(--muted-foreground);border:1px solid var(--border);border-radius:var(--radius);background:transparent;padding:7px 10px;cursor:pointer}
button[aria-pressed=true]{background:var(--secondary);color:var(--foreground);border-color:var(--ring)}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.controls{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.group{display:flex;gap:5px}
h2{font-size:17px;line-height:1.4;margin:16px 0 4px}.scope,.note,.detail{color:var(--muted-foreground);font-size:12px;line-height:1.5}.scope{margin:0}.headline{font-size:28px;line-height:1.15;margin:13px 0 3px;font-weight:650;font-variant-numeric:tabular-nums}.gaintext{font-size:13px;margin:0;line-height:1.5}
#chart{height:365px;margin-top:17px;position:relative}.row{height:83px;position:relative}.labels{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.label{font-size:13px;font-weight:600}.value{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}.detail{font-size:11px}.track{height:15px;background:var(--secondary);position:relative;margin-top:7px;border-radius:3px}.bar{height:15px;border-radius:3px;transition:width .2s}.historic .bar{opacity:.65}.dot{position:absolute;top:4px;width:7px;height:7px;border:1px solid var(--foreground);border-radius:50%;background:var(--card);transform:translateX(-50%)}.axis{font-size:11px;color:var(--muted-foreground);display:flex;justify-content:space-between}.note{margin:4px 0 0}.status{font-size:12px;color:var(--success);margin:12px 0 0}
@media(max-width:450px){.controls{gap:10px}.group button{font-size:11px;padding:7px}.headline{font-size:25px}.label{font-size:12px}.detail{font-size:10px}.value{font-size:13px}#chart{height:380px}.row{height:87px}}
</style></head><body><main><section aria-label="BeamZ CUDA comparison">
<div class="controls"><div class="group" aria-label="Workload"><button id="mie" aria-pressed="true">512³ Mie</button><button id="small" aria-pressed="false">272³ Mie</button><button id="guide" aria-pressed="false">Guide</button></div><div class="group" aria-label="Timing"><button id="warm" aria-pressed="true">Warmed</button><button id="first" aria-pressed="false">First run</button></div></div>
<h2 id="title"></h2><p class="scope" id="scope"></p><p class="headline" id="headline"></p><p class="gaintext" id="gain"></p>
<div id="chart" role="img"></div><p class="note" id="note"></p><p class="status">All 30 state leaves bytewise exact · RTX3090, 250 W · FP32 · CPML12</p>
<p class="note">Prepared solver execution; compilation, upload and readback excluded. First run includes material certification and graph construction. Setup is separate. Production default unchanged.</p>
</section></main><script>
const data={"mie": [{"label": "Main default CUDA", "detail": "Streamed \u00b7 pinned main d5282752 \u00b7 earlier single process", "warm": 275.3076223729877, "first": 274.19332911097445, "points": [], "color": "--chart-3", "historical": true}, {"label": "Main explicit Mstep", "detail": "Default tile / whole columns \u00b7 earlier single process", "warm": 195.6656969980104, "first": 194.7969448210206, "points": [], "color": "--chart-4", "historical": true}, {"label": "Previous temporal CUDA", "detail": "Depth 16 \u00b7 two fresh processes in current ABBA", "warm": 155.60422526748152, "first": 165.73464461852564, "points": [155.6124778839294, 155.59597265103366], "firstPoints": [165.83619094500318, 165.6330982920481], "color": "--chart-2"}, {"label": "NoIO + support \u00b7 replicated", "detail": "NoIO uniform-E + support facts \u00b7 two fresh processes", "warm": 138.11225616908632, "first": 148.1322631984949, "points": [138.10446337307803, 138.1200489650946], "firstPoints": [148.09643340902403, 148.1680929879658], "color": "--chart-1"}, {"label": "Dedicated NoIO1024 \u00b7 late experiment", "detail": "One fresh process / one repeat \u00b7 experimental", "warm": 131.6336636749329, "first": 141.74369876191486, "points": [131.6336636749329], "firstPoints": [141.74369876191486], "color": "--chart-5"}], "small": [{"label": "Strong D2 UniformE", "detail": "Full 30 fs Mie \u00b7 one fresh process / one repeat", "warm": 16.353938574087806, "first": 16.136093580978923, "points": [], "color": "--chart-3"}, {"label": "Previous temporal CUDA", "detail": "Full 30 fs Mie \u00b7 one fresh process / one repeat", "warm": 25.098822693922557, "first": 27.24139371002093, "points": [], "color": "--chart-2"}, {"label": "New temporal CUDA", "detail": "Full 30 fs Mie \u00b7 one fresh process / one repeat", "warm": 22.74031391798053, "first": 24.902790967957117, "points": [], "color": "--chart-1"}], "guide": [{"label": "Strong D2 UniformE", "detail": "Improved D2 / segment64 \u00b7 one fresh process", "warm": 5.120641586952843, "first": 5.124778226017952, "points": [5.104401572956704, 5.122433160082437, 5.120641586952843], "color": "--chart-2"}, {"label": "New temporal CUDA", "detail": "Same selected build \u00b7 one fresh process", "warm": 4.446652269922197, "first": 6.49538845801726, "points": [4.446199368918315, 4.448365343967453, 4.446652269922197], "color": "--chart-1"}], "paired": 1.1266503824107312, "pairRange": [1.1265270597345034, 1.1267737050869593], "late": true};let view='mie',metric='warm';const $=id=>document.getElementById(id);
function draw(){for(const key of ['mie','small','guide'])$(key).setAttribute('aria-pressed',key===view);for(const key of ['warm','first'])$(key).setAttribute('aria-pressed',key===metric);
const rows=data[view],step=view==='mie'?50:view==='small'?10:2,max=Math.ceil(Math.max(...rows.map(r=>r[metric]))/step)*step,a=rows[view==='small'?0:view==='mie'?2:rows.length-2][metric],b=rows[rows.length-1][metric],ratio=view==='mie'&&metric==='warm'&&!data.late?data.paired:a/b;
$('title').textContent={mie:'512³ Mie · complete 30 fs solve',small:'272³ Mie · complete 30 fs solve',guide:'512³ waveguide · 512 updates'}[view];$('scope').textContent={mie:'134.2 million Yee cells · 680 nm cube · 12,347 updates · six-face DFT',small:'20.1 million Yee cells · 6,560 updates · retain D2 for this case',guide:'Mode source · two fixed-aperture, three-frequency monitors'}[view];
$('headline').textContent=ratio>=1?ratio.toFixed(3)+'× throughput':((b/a-1)*100).toFixed(1)+'% longer';$('gain').textContent=(view==='mie'?'Versus the previous temporal CUDA build':'Versus strong D2 UniformE-v2')+(metric==='warm'?' · warmed execution':' · first execution')+(view==='mie'&&data.late?' · latest: one fresh process':'');
$('chart').innerHTML=rows.map(r=>{const pts=metric==='warm'?r.points:(r.firstPoints||[]);return '<div class="row '+(r.historical?'historic':'')+'"><div class="labels"><span class="label">'+r.label+'</span><span class="value">'+r[metric].toFixed(2)+' s</span></div><div class="detail">'+r.detail+'</div><div class="track"><div class="bar" style="width:'+r[metric]/max*100+'%;background:var('+r.color+')"></div>'+pts.map(p=>'<span class="dot" title="Observed '+p.toFixed(6)+' seconds" style="left:'+p/max*100+'%"></span>').join('')+'</div></div>'}).join('')+'<div class="axis"><span>0 s</span><span>'+max+' s · lower is faster</span></div>';
$('chart').setAttribute('aria-label',rows.map(r=>r.label+': '+r[metric].toFixed(3)+' seconds').join('; '));
$('chart').style.height=rows.length===5?'455px':window.innerWidth<450?'380px':'365px';
$('note').textContent={mie:'Current control/candidate: two fresh processes each, ABBA, one timed repeat each; bars show medians. Dots show process observations. Main rows are earlier same-fixture single-process measurements at d5282752. Ranges are not confidence intervals.',small:'One fresh process per variant, one timed repeat each. The new temporal build improves on the previous temporal build but is slower than D2 here. Domain size alone cannot select the best runtime.',guide:'One fresh process per variant; warmed medians of three samples. Dots are within-process observations, not independent process repeats. Setup: D2 3.12 s, temporal 2.52 s. The first short guide solve is slower with the temporal build.'}[view];
if(view==='mie'&&data.late)$('note').textContent+=' Late NoIO1024 is one additional process, not part of ABBA. Memory/sync checks pass; broader racecheck timed out. Guide/272³ tabs show the replicated NoIO+support generation, not this late mapping.';
}for(const key of ['mie','small','guide'])$(key).onclick=()=>{view=key;draw()};for(const key of ['warm','first'])$(key).onclick=()=>{metric=key;draw()};draw();
</script></body></html>
