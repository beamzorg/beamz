name: CUDA extension

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/cuda.yml"
      - "beamz/simulation/backend.py"
      - "beamz/simulation/_cuda_abi.py"
      - "beamz/simulation/compile.py"
      - "beamz/simulation/cuda/**"
      - "beamz/simulation/execute.py"
      - "beamz/simulation/kernels.py"
      - "beamz/simulation/model.py"
      - "cuda/**"
      - "scripts/generate_cuda_abi.py"
      - "scripts/benchmark_h100.py"
      - "scripts/benchmark_cuda_revision.py"
      - "scripts/benchmark_cuda_realistic.py"
      - "tests/hardware/test_cuda_backends.py"
      - "tests/hardware/test_cuda_mstep.py"
      - "tests/performance/**"
  pull_request:
    paths:
      - ".github/workflows/cuda.yml"
      - "beamz/simulation/backend.py"
      - "beamz/simulation/_cuda_abi.py"
      - "beamz/simulation/compile.py"
      - "beamz/simulation/cuda/**"
      - "beamz/simulation/execute.py"
      - "beamz/simulation/kernels.py"
      - "beamz/simulation/model.py"
      - "cuda/**"
      - "scripts/generate_cuda_abi.py"
      - "scripts/benchmark_h100.py"
      - "scripts/benchmark_cuda_revision.py"
      - "scripts/benchmark_cuda_realistic.py"
      - "tests/hardware/test_cuda_backends.py"
      - "tests/hardware/test_cuda_mstep.py"
      - "tests/performance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    name: Build private CUDA 12 component
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Install host build tools
        run: >-
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          build-essential ca-certificates curl git
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Install BeamZ test dependencies
        run: uv sync --python 3.11 --extra test --no-install-project
      - name: Build optional private component
        env:
          UV_PYTHON: "3.11"
        run: uv build --wheel cuda
      - name: Import component through the BeamZ namespace
        run: |
          uv pip install --python .venv/bin/python \
            --no-deps cuda/dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE"/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          import beamz._cuda as cuda

          schema = json.loads(
              (Path(os.environ["GITHUB_WORKSPACE"]) / "cuda/abi_layout.json").read_text()
          )
          assert cuda.__version__ == schema["component_version"]
          assert cuda.__abi_version__ == schema["abi_version"]
          assert set(cuda.registrations()) == set(schema["targets"].values())
          print(cuda.__version__)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: beamz-private-cuda-component
          path: cuda/dist/*.whl

  cpu:
    # The same kernels built for the host through the OpenMP block scheduler:
    # parity against JAX on every PR without a GPU runner.
    name: CPU component parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Install BeamZ test environment
        run: uv sync --python 3.11 --extra test
      - name: Build the CPU component
        env:
          UV_PYTHON: "3.11"
        run: >-
          uv build --wheel cuda
          -Ccmake.define.BEAMZ_GPU_PLATFORM=CPU
          -Cbuild-dir=build/cpu
      - name: Install the CPU component
        run: >-
          uv pip install --python .venv/bin/python --target "${GITHUB_WORKSPACE}"
          --no-deps cuda/dist/*.whl
      - name: Check that the CPU component is selected
        env:
          JAX_PLATFORMS: cpu
        run: |
          uv run --no-sync --no-active --python 3.11 python - <<'PY'
          from beamz.simulation.backend import cuda_backend_status

          status = cuda_backend_status()
          print(status.as_dict())
          assert status.available, status.reason
          assert status.gpu_platform == "cpu", status.gpu_platform
          PY
      - name: Run CPU parity
        env:
          JAX_PLATFORMS: cpu
        run: >-
          uv run --no-sync --no-active --python 3.11 python -m pytest
          tests/hardware/test_cuda_backends.py tests/hardware/test_cuda_autodiff.py
          tests/hardware/test_cuda_mstep.py -v --tb=short --durations=20

  hip:
    # Compile-only: no AMD GPU runner. Catches CUDA runtime names without a
    # HIP alias and hip-clang errors before they reach hardware. gfx90a and
    # gfx942 keep the unvalidated 64-wide wave path compiling.
    name: Build HIP component
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: rocm/dev-ubuntu-24.04:7.2
    steps:
      - name: Install host build tools
        run: >-
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          build-essential ca-certificates curl git
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Build the HIP component
        env:
          UV_PYTHON: "3.11"
          # An environment prefix: a CMAKE_PREFIX_PATH define would replace
          # the one scikit-build-core sets for nanobind.
          CMAKE_PREFIX_PATH: /opt/rocm
        run: >-
          uv build --wheel cuda
          -Ccmake.define.BEAMZ_GPU_PLATFORM=HIP
          "-Ccmake.define.BEAMZ_HIP_ARCHITECTURES=gfx1100;gfx90a;gfx942"
          -Ccmake.define.BEAMZ_HIP_ALLOW_WAVE64=ON
          -Ccmake.define.CMAKE_HIP_COMPILER=/opt/rocm/lib/llvm/bin/clang++
          -Cbuild-dir=build/hip

  h100:
    name: H100 parity and canonical benchmarks
    if: >-
      ${{ vars.BEAMZ_H100_RUNNER_ENABLED == 'true' &&
          github.event_name != 'pull_request' }}
    needs: component
    runs-on: [self-hosted, linux, x64, h100]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install 3.11
      - name: Install test environment with CUDA JAX
        run: |
          uv sync --python 3.11 --extra test --no-install-project
          uv pip install --python .venv/bin/python "jax[cuda12]>=0.4.31"
      - uses: actions/download-artifact@v8
        with:
          name: beamz-private-cuda-component
          path: ${{ runner.temp }}/cuda-dist
      - name: Install private CUDA component
        run: >-
          uv pip install --python .venv/bin/python --target "${GITHUB_WORKSPACE}"
          --no-deps "${RUNNER_TEMP}"/cuda-dist/*.whl
      - name: Run complete-state numerical parity
        run: >-
          uv run --no-sync --no-active --python 3.11 python -m pytest
          tests/hardware/test_cuda_backends.py tests/hardware/test_cuda_mstep.py
          -v --tb=short --durations=20
      - name: Capture canonical H100 records
        run: |
          mkdir -p "${RUNNER_TEMP}/benchmark-results"
          for workload in bare_3d realistic_3d; do
            for backend in jax cuda_streamed cuda_hopper; do
              uv run --no-sync --no-active --python 3.11 python scripts/benchmark_h100.py \
                --workload "$workload" --backend "$backend" --samples 5 \
                --output "${RUNNER_TEMP}/benchmark-results/${workload}-${backend}.json"
            done
          done
      - name: Capture CUDA schedule comparisons
        env:
          CUDA_VISIBLE_DEVICES: "0"
        run: |
          for shape in '64 96 128' '128 256 512' '256 512 512' '512 256 64'; do
            read -r z y x <<< "$shape"
            reference="${RUNNER_TEMP}/reference-${z}-${y}-${x}"
            for backend in cuda_streamed cuda_mstep; do
              options=()
              if [ "$backend" = cuda_streamed ]; then options+=(--save-reference); fi
              uv run --no-sync --no-active --python 3.11 python scripts/benchmark_cuda_revision.py \
                --root "$GITHUB_WORKSPACE" --backend "$backend" --shape "$z" "$y" "$x" \
                --material binary --steps 256 --samples 5 --reference "$reference" "${options[@]}" \
                --output "${RUNNER_TEMP}/benchmark-results/${z}-${y}-${x}-${backend}.json"
            done
          done
      - name: Enforce provisional CUDA promotion thresholds
        env:
          RESULT_DIR: ${{ runner.temp }}/benchmark-results
        run: |
          uv run --no-sync --no-active --python 3.11 python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_dir = Path(os.environ["RESULT_DIR"])
          streamed = json.loads(
              (result_dir / "realistic_3d-cuda_streamed.json").read_text()
          )
          hopper = json.loads(
              (result_dir / "realistic_3d-cuda_hopper.json").read_text()
          )
          streamed_gcups = float(streamed["kernel_gcups"])
          hopper_speedup = float(hopper["kernel_gcups"]) / streamed_gcups
          print(f"streamed realistic throughput: {streamed_gcups:.3f} GCUPS")
          print(f"Hopper/streamed realistic speedup: {hopper_speedup:.3f}x")
          if streamed_gcups < 20.0:
              raise SystemExit("streamed CUDA did not reach the 20 GCUPS promotion gate")
          if hopper_speedup < 1.15:
              raise SystemExit("Hopper CUDA did not reach the 1.15x promotion gate")
          PY
      - name: Upload H100 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h100-cuda-evidence
          path: ${{ runner.temp }}/benchmark-results/*.json
          if-no-files-found: warn
