name: Dependency Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python audit (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv python install "${{ matrix.python }}"
      - name: Verify and export the complete locked dependency set
        run: |
          uv lock --check
          uv export --frozen --all-extras --no-emit-project --no-hashes --output-file audit-requirements.txt
      # Exported versions are pinned and complete. Evaluate their environment
      # markers with each supported interpreter without installing project code.
      - name: Audit runtime and optional dependencies
        run: >-
          uv tool run --python "${{ matrix.python }}" pip-audit==2.10.1
          --requirement audit-requirements.txt --no-deps --disable-pip
          --format json --output python-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-audit-${{ matrix.python }}
          path: |
            audit-requirements.txt
            python-audit.json
          if-no-files-found: ignore

  rust:
    name: Rust audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the Rust lockfile
        run: cargo audit --file Cargo.lock --json > rust-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-audit
          path: rust-audit.json
          if-no-files-found: ignore
