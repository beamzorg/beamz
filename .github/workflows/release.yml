name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version:
    name: Verify release version metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag, Python package, and Rust workspace to agree
        run: python release_version.py --verify "${GITHUB_REF_NAME#v}"

  validation:
    needs: version
    uses: ./.github/workflows/release-validation.yml

  build-sdist:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
      - name: Build source distribution
        run: maturin sdist --out dist
      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-package-sdist
          path: dist/

  build-wheels:
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --locked --compatibility pypi
            --interpreter python3.10 --out dist
      - name: Smoke test the installed native wheel
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: python scripts/smoke_installed_wheel.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl

  build:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Inspect distribution contents
        run: python scripts/check_distributions.py
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  package-qualification:
    name: Qualify built GDSFactory workflow
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-x86_64-unknown-linux-gnu
          path: dist
      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: python-package-sdist
          path: dist
      - name: Qualify executable GDSFactory documentation against built wheel
        run: |
          python -m venv /tmp/beamz-wheel-qualification
          /tmp/beamz-wheel-qualification/bin/python -m pip install --upgrade pip
          beamz_wheel=$(find dist -name '*.whl' -print -quit)
          test -n "$beamz_wheel"
          /tmp/beamz-wheel-qualification/bin/python -m pip install "$beamz_wheel[gdsfactory]"
          (cd /tmp && /tmp/beamz-wheel-qualification/bin/python "$GITHUB_WORKSPACE/scripts/execute_markdown_python.py" "$GITHUB_WORKSPACE/docs/gdsfactory.md")
          (cd /tmp && JAX_PLATFORMS=cpu /tmp/beamz-wheel-qualification/bin/python "$GITHUB_WORKSPACE/scripts/gdsfactory_package_smoke.py")
      - name: Qualify executable GDSFactory documentation against source distribution
        run: |
          python -m venv /tmp/beamz-sdist-qualification
          /tmp/beamz-sdist-qualification/bin/python -m pip install --upgrade pip
          beamz_sdist=$(find dist -name '*.tar.gz' -print -quit)
          test -n "$beamz_sdist"
          /tmp/beamz-sdist-qualification/bin/python -m pip install "$beamz_sdist" "gdsfactory>=8.0"
          (cd /tmp && /tmp/beamz-sdist-qualification/bin/python "$GITHUB_WORKSPACE/scripts/execute_markdown_python.py" "$GITHUB_WORKSPACE/docs/gdsfactory.md")
          (cd /tmp && JAX_PLATFORMS=cpu /tmp/beamz-sdist-qualification/bin/python "$GITHUB_WORKSPACE/scripts/gdsfactory_package_smoke.py")

  github-release:
    needs: [build, package-qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
