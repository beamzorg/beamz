[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.4",
  "jax==0.9.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "beamz-cuda-component"
version = "0.31.0"
description = "Private optional CUDA component built from the BeamZ source tree"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "jax==0.9.0",
]

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = []
build-dir = "build/{wheel_tag}"
